<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registon Test — Matematika fanidan milliy sertifikat mashqi</title>
<meta name="description" content="Registon Test: matematikadan milliy sertifikat imtihoniga tayyorlanish uchun bepul namunaviy testlar. C dan A+ gacha darajalar, taymer va xatolar tahlili.">
<meta property="og:type" content="website">
<meta property="og:locale" content="uz_UZ">
<meta property="og:title" content="Registon Test — Matematika fanidan milliy sertifikat mashqi">
<meta property="og:description" content="C dan A+ gacha namunaviy matematika testlari, taymer va xatolar tahlili.">
<style>
:root{--bg:#f6f4ee;--ink:#14213d;--mut:#5b6478;--line:#d9d5c7;--card:#fffdf7;--acc:#1f4fd8;--ok:#1b7f4b;--bad:#b3261e;--grid:#ebe7da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--ink:#eef1fa;--mut:#9aa3ba;--line:#2a3352;--card:#161e36;--acc:#7da2ff;--ok:#4cc58a;--bad:#ff8a80;--grid:#151d33}}
:root[data-theme="dark"]{--bg:#0f1526;--ink:#eef1fa;--mut:#9aa3ba;--line:#2a3352;--card:#161e36;--acc:#7da2ff;--ok:#4cc58a;--bad:#ff8a80;--grid:#151d33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 12px}
p{margin:0 0 12px}.mut{color:var(--mut)}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lv{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:14px;text-align:left}
.lv b{display:block;font-size:2rem;line-height:1}.lv span{font-size:.85rem;color:var(--mut)}
.lv.done{border-color:var(--ok)}.lv.done span{color:var(--ok)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:18px;margin-top:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.opt{display:block;width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:8px;font-size:1.05rem}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.q{font-size:1.25rem;margin:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-weight:600;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.score{font-size:3rem;font-weight:700;line-height:1}
.rev{border-top:1px solid var(--line);padding:12px 0}.rev:first-of-type{border-top:0}
.tag{font-size:.85rem}.good{color:var(--ok)}.wrong{color:var(--bad)}
.hist{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px}.hist td{padding:6px 4px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Sozlamalar: o'tish foizi va vaqt (soniya) — kerak bo'lsa o'zgartiring
const CONFIG={passPercent:66,seconds:300};
// Savollar bazasi: yangi savol qo'shish uchun shu obyektga qo'shing
const BANK={
"C":[
{q:"12 + 8 × 2 = ?",o:["28","40","32","24"],a:0,e:"Avval ko'paytirish: 8×2=16, keyin 12+16=28."},
{q:"3x = 21 bo'lsa, x nechaga teng?",o:["6","7","8","9"],a:1,e:"x = 21 : 3 = 7."},
{q:"80 ning 25% i nechaga teng?",o:["15","20","25","30"],a:1,e:"80 : 4 = 20."}],
"C+":[
{q:"2x + 5 = 17 bo'lsa, x = ?",o:["5","6","7","8"],a:1,e:"2x = 12, x = 6."},
{q:"Kvadratning tomoni 7 sm. Uning perimetri necha sm?",o:["14","21","28","49"],a:2,e:"P = 4 × 7 = 28."},
{q:"√144 + 3² = ?",o:["19","21","23","25"],a:1,e:"12 + 9 = 21."}],
"B":[
{q:"x² − 5x + 6 = 0 tenglama ildizlari yig'indisi nechaga teng?",o:["5","6","−5","1"],a:0,e:"Viyet teoremasi: x₁ + x₂ = 5 (ildizlar 2 va 3)."},
{q:"Arifmetik progressiyada a₁ = 3, d = 4. a₅ = ?",o:["15","19","23","17"],a:1,e:"a₅ = 3 + 4·4 = 19."},
{q:"log₂ 32 = ?",o:["4","5","6","16"],a:1,e:"2⁵ = 32, demak 5."}],
"B+":[
{q:"f(x) = x² − 4x + 1 funksiyaning eng kichik qiymati?",o:["−3","−4","1","−1"],a:0,e:"Uchi x = 2 da: 4 − 8 + 1 = −3."},
{q:"sin 30° + cos 60° = ?",o:["1/2","1","3/2","√3"],a:1,e:"1/2 + 1/2 = 1."},
{q:"Tomonlari 6, 8, 10 bo'lgan uchburchakning yuzi?",o:["24","30","48","40"],a:0,e:"6² + 8² = 10², to'g'ri burchakli: S = 6·8/2 = 24."}],
"A":[
{q:"f(x) = x³ − 3x² bo'lsa, f′(2) = ?",o:["0","2","−2","6"],a:0,e:"f′(x) = 3x² − 6x, f′(2) = 12 − 12 = 0."},
{q:"2ˣ = 1/8 tenglamani yeching.",o:["3","−3","−2","1/3"],a:1,e:"1/8 = 2⁻³, demak x = −3."},
{q:"C(6, 2) = ?",o:["12","15","30","20"],a:1,e:"6·5 / 2 = 15."}],
"A+":[
{q:"∫₀² 3x² dx = ?",o:["6","8","12","4"],a:1,e:"x³ ning 0 dan 2 gacha: 8 − 0 = 8."},
{q:"lim (x→0) sin(3x) / x = ?",o:["1","3","0","1/3"],a:1,e:"sin(3x)/(3x) → 1, shuning uchun limit 3."},
{q:"x² − 6x + k = 0 tenglama ikkita teng ildizga ega bo'lsa, k = ?",o:["6","9","3","36"],a:1,e:"D = 36 − 4k = 0 bo'lsa k = 9."}]
};
const LEVELS=Object.keys(BANK);
const $=s=>document.querySelector(s);const app=$("#app");
let st={level:null,i:0,ans:[],left:0,timer:null};
function load(){try{return JSON.parse(localStorage.getItem("mat-cert")||"{}")}catch(e){return {}}}
function save(d){try{localStorage.setItem("mat-cert",JSON.stringify(d))}catch(e){}}
function home(){
 clearInterval(st.timer);const d=load();const best=d.best||{};
 const hist=(d.hist||[]).slice(-5).reverse();
 app.innerHTML=`<h1>Registon Test</h1><p class="mut">Matematika fanidan milliy sertifikat mashqi. Darajani tanlang va namunaviy testni yeching. Har bir testda ${CONFIG.seconds/60} daqiqa vaqt bor.</p>
 <div class="levels">${LEVELS.map(l=>`<button class="lv ${best[l]>=CONFIG.passPercent?"done":""}" data-l="${l}"><b>${l}</b><span>${best[l]!=null?"Eng yaxshi: "+best[l]+"%":"Hali yechilmagan"}</span></button>`).join("")}</div>
 ${hist.length?`<div class="card"><h2>So'nggi urinishlar</h2><table class="hist">${hist.map(h=>`<tr><td><b>${h.l}</b></td><td>${h.c}/${h.n} to'g'ri</td><td class="${h.p>=CONFIG.passPercent?"good":"wrong"}">${h.p}%</td><td class="mut">${h.d}</td></tr>`).join("")}</table></div>`:""}
 <p class="mut" style="font-size:.85rem;margin-top:28px">Bu mustaqil mashq platformasi. U davlat imtihon markazi bilan bog'liq emas va rasmiy imtihon natijasini bermaydi.</p>`;
 app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(b.dataset.l));
}
function start(l){st={level:l,i:0,ans:Array(BANK[l].length).fill(null),left:CONFIG.seconds,timer:null};
 st.timer=setInterval(()=>{st.left--;const t=$("#t");if(t)t.textContent=fmt(st.left);if(st.left<=0)finish()},1000);quiz()}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function quiz(){
 const Q=BANK[st.level],q=Q[st.i];
 app.innerHTML=`<div class="bar"><b>${st.level} daraja</b><span id="t">${fmt(st.left)}</span></div>
 <div class="prog"><i style="width:${(st.i)/Q.length*100}%"></i></div>
 <div class="card"><p class="mut">${st.i+1} / ${Q.length}-savol</p><p class="q">${q.q}</p>
 ${q.o.map((o,k)=>`<button class="opt ${st.ans[st.i]===k?"sel":""}" data-k="${k}">${o}</button>`).join("")}</div>
 <div class="bar"><button class="btn ghost" id="prev" ${st.i?"":"disabled"}>Oldingisi</button>
 <button class="btn" id="next">${st.i==Q.length-1?"Testni topshirish":"Keyingisi"}</button></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ans[st.i]=+b.dataset.k;quiz()});
 $("#prev").onclick=()=>{st.i--;quiz()};
 $("#next").onclick=()=>{if(st.i==Q.length-1)finish();else{st.i++;quiz()}};
}
function finish(){
 clearInterval(st.timer);const Q=BANK[st.level];
 const c=Q.filter((q,i)=>st.ans[i]===q.a).length,p=Math.round(c/Q.length*100),pass=p>=CONFIG.passPercent;
 const d=load();d.best=d.best||{};d.hist=d.hist||[];
 d.best[st.level]=Math.max(d.best[st.level]||0,p);
 d.hist.push({l:st.level,c,n:Q.length,p,d:new Date().toLocaleDateString("uz-UZ")});d.hist=d.hist.slice(-30);save(d);
 const idx=LEVELS.indexOf(st.level),nxt=LEVELS[idx+1];
 app.innerHTML=`<h1>${pass?st.level+" darajasi o'tildi":st.level+" darajasi o'tilmadi"}</h1>
 <div class="card"><div class="score ${pass?"good":"wrong"}">${p}%</div><p class="mut">${c} / ${Q.length} ta to'g'ri javob. O'tish chegarasi: ${CONFIG.passPercent}%.</p></div>
 <div class="card"><h2>Xatolar tahlili</h2>${Q.map((q,i)=>{const u=st.ans[i],ok=u===q.a;return `<div class="rev"><p><b>${i+1}.</b> ${q.q}</p>
 <p class="tag ${ok?"good":"wrong"}">${ok?"To'g'ri":"Sizning javobingiz: "+(u==null?"belgilanmagan":q.o[u])}</p>
 ${ok?"":`<p class="tag">To'g'ri javob: <b>${q.o[q.a]}</b></p>`}<p class="tag mut">${q.e}</p></div>`}).join("")}</div>
 <div class="bar"><button class="btn ghost" id="again">Qayta yechish</button>
 ${pass&&nxt?`<button class="btn" id="up">${nxt} darajaga o'tish</button>`:`<button class="btn" id="hm">Darajalar</button>`}</div>`;
 $("#again").onclick=()=>start(st.level);
 const u=$("#up");if(u)u.onclick=()=>start(nxt);
 const h=$("#hm");if(h)h.onclick=home;
}
home();
</script>
</body>
</html>
